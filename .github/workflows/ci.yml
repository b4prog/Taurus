name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-build-test:
    name: Validate, Build, and Test
    runs-on: ubuntu-latest

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          npm run rust:fmt

      - name: Lint (warnings are errors)
        run: |
          npm run lint
          npm run rust:clippy

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: |
          npm run test -- --browsers=ChromeHeadless
          npm run rust:test

      - name: Build app (no bundle)
        run: npm run tauri:build -- --no-bundle
